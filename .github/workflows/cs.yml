name: Extract /app from GHCR image (all architectures)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（docker_main / 1.6.0 / sha-ddf65e7，留空自动取最新语义化版本）'
        required: false
        default: ''
      src_path:
        description: '镜像内要提取的目录或文件路径'
        required: false
        default: '/app'

env:
  IMAGE_NAME: smart-open/traeworkassistant   # 不带 ghcr.io/ 前缀，不带 tag

jobs:
  # ============================================================
  # Job 1：解析 tag + 枚举该 tag 支持的所有 linux 平台
  # ============================================================
  resolve:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      image: ${{ steps.tag.outputs.image }}
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            # 匿名 token 拉取 GHCR tag 列表（公共镜像无需额外凭证）
            TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:${IMAGE_NAME}:pull&service=ghcr.io" \
                    | jq -r .token)
            TAGS=$(curl -s -H "Authorization: Bearer $TOKEN" \
                    "https://ghcr.io/v2/${IMAGE_NAME}/tags/list" | jq -r '.tags[]')
            echo "远端全部 tag:"
            echo "$TAGS"

            # 挑最大的语义化版本（如 1.6.0），没有则兜底 docker_main
            TAG=$(echo "$TAGS" | grep -E '^v?[0-9]+(\.[0-9]+)*$' \
                  | sort -V | tail -1)
            [ -z "$TAG" ] && TAG="docker_main"
          fi
          echo "使用 tag: $TAG"
          echo "image=ghcr.io/${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: List platforms for this tag
        id: list
        run: |
          IMAGE="${{ steps.tag.outputs.image }}"

          # --raw 输出原始 OCI index JSON，jq 过滤 linux 平台，
          # 自动排除 unknown/unknown 的 provenance/SBOM 清单
          PLATFORMS=$(docker buildx imagetools inspect "$IMAGE" --raw \
            | jq -r '.manifests[]
                     | select(.platform.os == "linux")
                     | .platform as $p
                     | ($p.os + "/" + $p.architecture
                        + (if $p.variant then "/" + $p.variant else "" end))' \
            | sort -u)

          if [ -z "$PLATFORMS" ]; then
            echo "::warning::未发现 linux 平台，回退 linux/amd64"
            PLATFORMS="linux/amd64"
          fi

          # 生成对象数组矩阵，safe 字段把 / 换成 - 用于 artifact 名
          # 结果形如：[{"platform":"linux/amd64","safe":"linux-amd64"},...]
          MATRIX=$(echo "$PLATFORMS" | jq -R -s -c '
            split("\n")
            | map(select(length > 0))
            | map({platform: ., safe: (gsub("/"; "-"))})')

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "生成的矩阵: $MATRIX"

  # ============================================================
  # Job 2：matrix 并行拉取各架构镜像，提取 /app 并按架构重命名
  # ============================================================
  extract:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      fail-fast: false          # 某架构失败不影响其他架构继续
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and extract (${{ matrix.platform }})
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          PLATFORM: ${{ matrix.platform }}
          SAFE_NAME: ${{ matrix.safe }}          # 例如 linux-amd64
          SRC_PATH: ${{ inputs.src_path || '/app' }}
        run: |
          echo ">>> 拉取 $IMAGE ($PLATFORM)"
          docker pull --platform "$PLATFORM" "$IMAGE"

          echo ">>> 创建临时容器（不运行，无需 QEMU）"
          docker create --platform "$PLATFORM" --name extract-tmp "$IMAGE"

          echo ">>> 拷出: $SRC_PATH"
          mkdir -p ./out
          if ! docker cp "extract-tmp:$SRC_PATH" ./out/app ; then
            echo "::error::路径 $SRC_PATH 不存在，列出容器根目录供排查："
            docker export extract-tmp -o image.tar
            tar -tf image.tar | head -80
            exit 1
          fi
          docker rm -f extract-tmp || true

          # 按架构重命名：out/app -> out/app-linux-amd64
          mv ./out/app "./out/app-${SAFE_NAME}"

          echo ">>> 最终产物结构:"
          find ./out -maxdepth 2 -exec ls -ld {} \;

          # 如果里面是 Go/C 二进制，可验证真实架构（ELF ... arm64 / x86-64）
          file "./out/app-${SAFE_NAME}"/* 2>/dev/null || true

      - name: Upload artifact per arch
        uses: actions/upload-artifact@v4
        with:
          # 使用 safe 名（不含 /），绕开 upload-artifact 的文件系统兼容限制
          name: traeworkassistant-${{ matrix.safe }}
          path: ./out/
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # Job 3：在 Actions 页面生成可视化的结果摘要
  # ============================================================
  summary:
    needs: [resolve, extract]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "## 📦 提取结果"
            echo ""
            echo "- **镜像**: \`${{ needs.resolve.outputs.image }}\`"
            echo "- **目标路径**: \`${{ inputs.src_path || '/app' }}\`"
            echo "- **平台矩阵**: \`${{ needs.resolve.outputs.matrix }}\`"
            echo ""
            echo "各架构产物见上方 artifact：\`traeworkassistant-<safe-arch>\`"
          } >> "$GITHUB_STEP_SUMMARY"
