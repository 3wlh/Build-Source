name: Extract binaries from GHCR image (all architectures)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（如 docker_main / 1.6.0 / sha-ddf65e7，留空自动取最新语义化版本）'
        required: false
        default: ''
      binary_path:
        description: '镜像内二进制文件路径'
        required: false
        default: '/app/traeworkassistant'

env:
  IMAGE_NAME: smart-open/traeworkassistant   # 不带 ghcr.io/ 前缀，不带 tag

jobs:
  # ============================================================
  # Job 1：解析 tag + 枚举该 tag 支持的所有 linux 平台
  # ============================================================
  resolve:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      image: ${{ steps.tag.outputs.image }}
      platforms: ${{ steps.list.outputs.platforms }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            # 匿名 token 拉取 GHCR tag 列表（公共镜像无需额外凭证）
            TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:${IMAGE_NAME}:pull&service=ghcr.io" \
                    | jq -r .token)
            TAGS=$(curl -s -H "Authorization: Bearer $TOKEN" \
                    "https://ghcr.io/v2/${IMAGE_NAME}/tags/list" | jq -r '.tags[]')
            echo "远端全部 tag:"
            echo "$TAGS"

            # 挑最大的语义化版本（如 1.6.0），没有则兜底 docker_main
            TAG=$(echo "$TAGS" | grep -E '^v?[0-9]+(\.[0-9]+)*$' \
                  | sort -V | tail -1)
            [ -z "$TAG" ] && TAG="docker_main"
          fi
          echo "使用 tag: $TAG"
          echo "image=ghcr.io/${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: List platforms for this tag
        id: list
        run: |
          IMAGE="${{ steps.tag.outputs.image }}"

          # --raw 输出原始 index JSON，jq 过滤 linux 平台
          # （unknown/unknown 的 provenance/SBOM 清单会被自动排除）
          PLATFORMS=$(docker buildx imagetools inspect "$IMAGE" --raw \
            | jq -r '.manifests[]
                     | select(.platform.os == "linux")
                     | .platform as $p
                     | ($p.os + "/" + $p.architecture
                        + (if $p.variant then "/" + $p.variant else "" end))' \
            | sort -u)

          if [ -z "$PLATFORMS" ]; then
            echo "::warning::未发现 linux 平台，回退 linux/amd64"
            PLATFORMS="linux/amd64"
          fi

          MATRIX=$(echo "$PLATFORMS" | jq -R -s -c 'split("\n") | map(select(length>0))')
          echo "platforms=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "发现的平台: $MATRIX"

  # ============================================================
  # Job 2：matrix 并行拉取各架构镜像，提取二进制
  # ============================================================
  extract:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      fail-fast: false          # 某架构失败不影响其他架构继续
      matrix:
        platform: ${{ fromJSON(needs.resolve.outputs.platforms) }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 只 create + cp，不 run，因此 arm64 提取在 amd64 runner 上无需 QEMU
      - name: Pull and extract (${{ matrix.platform }})
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          PLATFORM: ${{ matrix.platform }}
          BINARY_PATH: ${{ inputs.binary_path || '/app/traeworkassistant' }}
        run: |
          echo ">>> 拉取 $IMAGE ($PLATFORM)"
          docker pull --platform "$PLATFORM" "$IMAGE"

          echo ">>> 创建临时容器"
          docker create --platform "$PLATFORM" --name extract-tmp "$IMAGE"

          echo ">>> 拷出二进制: $BINARY_PATH"
          mkdir -p ./out
          if ! docker cp "extract-tmp:$BINARY_PATH" ./out/ ; then
            echo "::error::路径 $BINARY_PATH 不存在，列出容器根目录供排查："
            docker export extract-tmp -o image.tar
            tar -tf image.tar | head -80
            exit 1
          fi
          docker rm -f extract-tmp || true

          echo ">>> 验证二进制架构:"
          file ./out/*

      - name: Upload artifact per arch
        uses: actions/upload-artifact@v4
        with:
          name: traeworkassistant-${{ matrix.platform }}
          path: ./out/
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # Job 3：汇总结果（可选，方便在 Actions 页面一眼看到产物矩阵）
  # ============================================================
  summary:
    needs: [resolve, extract]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          {
            echo "## 提取结果"
            echo ""
            echo "- **镜像**: \`${{ needs.resolve.outputs.image }}\`"
            echo "- **平台**: \`${{ needs.resolve.outputs.platforms }}\`"
            echo ""
            echo "各架构产物见上方 artifact：\`traeworkassistant-<platform>\`"
          } >> "$GITHUB_STEP_SUMMARY"
